name: Release

# Manual: Actions > Release > Run workflow, or
#   gh workflow run release.yml -f version=1.2.3
# Publishes a non-prerelease GitHub Release (with the executable jar) and the package to GitHub Packages.
# Maven Central is a separate, human-enabled step (see the comment at the end).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.2.3 (no leading v, no -SNAPSHOT)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Write GitHub Packages credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings><servers><server><id>github</id>
            <username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password>
          </server></servers></settings>
          XML
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already exists"; exit 1; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set version
        run: sed -i '0,/^  <version>.*<\/version>/s||  <version>'"$VERSION"'</version>|' pom.xml
      - run: ./build-and-test
        shell: bash
      - name: Deploy to GitHub Packages
        run: ./mvnw -B -DskipTests deploy
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes \
            --title "v$VERSION" target/riktigrefactor-java-$VERSION.jar
      # TODO(human): Maven Central needs sources/javadoc jars, GPG signing and
      # central-publishing-maven-plugin with OSSRH/Central Portal credentials.
